# Remote experiment orchestration configuration
# Used by: deploy/scripts/run_remote.py
#
# servers[].host           — SSH hostname or alias from ~/.ssh/config
# servers[].port           — SSH port (default 22)
# servers[].user           — SSH user (default $USER)
# servers[].identity_file  — optional path to SSH private key (~ expanded locally)
# servers[].experiments    — list to run on this host
#                            valid: trafficcamnet, vehiclemakenet, vehicletypenet,
#                                   lpdnet, lprnet, nomeroff_lpd, nomeroff_ocr
#
# remote.deploy_dir        — directory on the remote host where deploy/ is rsynced
# remote.venv              — Python virtualenv name inside deploy_dir
# remote.results_local     — local directory where results are collected (per-host subdirs)

servers:
  # ssh1.qudata.ai больше недоступен — все эксперименты Goal 4 перенесены на ssh9
  # (миграция 2026-05-17 после фикса normalize_brand и §6.5 dataset migration).
  - host: ssh9.qudata.ai
    port: 19478
    user: root
    identity_file: ~/.ssh/qudata
    experiments:
      # Goal 4 migration: §6.5 datasets + class-mapping fixes
      - trafficcamnet      # BDD100K val 10K (native labels, было COCO val2017)
      - vehiclemakenet     # mad-cars sample 5K (фикс normalize_brand collapse)
      - vehicletypenet     # Stanford Cars + Make→Type mapping (было BIT-Vehicle/Kaggle)
      # RU LP swap (Goal 5)
      - nomeroff_lpd
      - nomeroff_ocr
      # Legacy baseline (US-trained LPDNet/LPRNet) сохранён в results_collected/ssh9.qudata.ai/results/{lpdnet,lprnet}/.

remote:
  deploy_dir: ~/cars-eval
  venv: venv
  results_local: results_collected
